# XcodeGen spec — run `xcodegen generate` in this folder to create FitScore.xcodeproj.
name: FitScore
options:
  bundleIdPrefix: app.fitscore
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.5
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  FitScore:
    type: application
    platform: iOS
    sources: [FitScore]
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitscore.FitScore
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: FitScore
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: FitScore uses the camera so you can snap your outfit and get it rated.
        NSPhotoLibraryUsageDescription: Pick an outfit photo from your library to get it rated.
        LSApplicationQueriesSchemes: [instagram-stories]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        FacebookAppID: $(FACEBOOK_APP_ID)
